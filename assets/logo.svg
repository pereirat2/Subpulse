<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="SubPulse - subdomain reconnaissance">
  <title>SubPulse - subdomain reconnaissance</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#06080f"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <radialGradient id="glowL" cx="0.18" cy="0.25" r="0.6">
      <stop offset="0%"  stop-color="#00ffc8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ffc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.88" cy="0.85" r="0.55">
      <stop offset="0%"  stop-color="#ff2e63" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff2e63" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#eafff8"/>
      <stop offset="55%" stop-color="#7afcff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ffc8" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#00ffc8" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#7afcff" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#00ffc8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ffc8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00ffc8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <radialGradient id="gridMask" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="340" fill="url(#gridMask)"/>
    </mask>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)" rx="18"/>
  <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridFade)" rx="18"/>
  <rect width="1200" height="340" fill="url(#glowL)" rx="18"/>
  <rect width="1200" height="340" fill="url(#glowR)" rx="18"/>

  <g stroke="#00ffc8" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M24 44 V24 H44"/>
    <path d="M1176 44 V24 H1156"/>
    <path d="M24 296 V316 H44"/>
    <path d="M1176 296 V316 H1156"/>
  </g>

  <g transform="translate(40,42)" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#5f7d80">
    <circle cx="6" cy="-3" r="4" fill="#00ffc8"/>
    <circle cx="6" cy="-3" r="4" fill="#00ffc8" opacity="0.35" filter="url(#strong)"/>
    <text x="18" y="0" letter-spacing="2">SUBPULSE  //  v1</text>
  </g>

  <g transform="translate(1160,42)" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#5f7d80" letter-spacing="2">
    <text>SINGLE-FILE &#xB7; PYTHON 3.9+ &#xB7; MIT</text>
  </g>

  <g transform="translate(600,178)" text-anchor="middle">
    <text font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace"
          font-size="120" font-weight="800" letter-spacing="6"
          fill="#00ffc8" fill-opacity="0.18" filter="url(#strong)">SUBPULSE</text>
    <text font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace"
          font-size="120" font-weight="800" letter-spacing="6"
          fill="url(#wordmark)">SUBPULSE</text>
  </g>

  <g transform="translate(0,238)">
    <path d="M 80 0 H 360
             l 22 -10 l 14 -38 l 18 76 l 16 -28 l 26 0
             H 600
             l 18 -8 l 10 -52 l 22 96 l 12 -36 l 24 0
             H 820
             l 20 -8 l 12 -44 l 18 84 l 14 -32 l 28 0
             H 1120"
          fill="none" stroke="#00ffc8" stroke-opacity="0.55" stroke-width="6" filter="url(#soft)"/>
    <path d="M 80 0 H 360
             l 22 -10 l 14 -38 l 18 76 l 16 -28 l 26 0
             H 600
             l 18 -8 l 10 -52 l 22 96 l 12 -36 l 24 0
             H 820
             l 20 -8 l 12 -44 l 18 84 l 14 -32 l 28 0
             H 1120"
          fill="none" stroke="url(#pulse)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="5" fill="#7afcff">
      <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto"
        path="M 80 0 H 360
              l 22 -10 l 14 -38 l 18 76 l 16 -28 l 26 0
              H 600
              l 18 -8 l 10 -52 l 22 96 l 12 -36 l 24 0
              H 820
              l 20 -8 l 12 -44 l 18 84 l 14 -32 l 28 0
              H 1120"/>
      <animate attributeName="r" values="3;6;3" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(600,304)" text-anchor="middle"
     font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace"
     font-size="14" letter-spacing="8" fill="#5f7d80">
    <text>SUBDOMAIN  &#xB7;  RECONNAISSANCE</text>
  </g>
</svg>
